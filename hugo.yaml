baseURL: "https://placeholder.netlify.app/"
languageCode: en-us
title: Cosmic Ink
theme: PaperMod

params:
  # profile-mode
  profileMode:
    # Needs to be explicitly set
    enabled: true
    title: 
    imageUrl: "/images/avatar.png"
    imageWidth: 350
    imageHeight: 300
    buttons:
      - name: Posts
        url: /posts
      - name: Tags
        url: /tags
      - name: Archives
        url: /archives
  socialIcons:
  ShowBreadCrumbs: true
  ShowReadingTime: true
  ShowShareButtons: false
  ShowCodeCopyButtons: true
  math: true
  ShowAllPagesInArchive: true

menu:
  main:
    - identifier: posts
      name: Posts
      url: /posts/
      weight: 10
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 20
    - identifier: archives
      name: Archives
      url: /archives/
      weight: 30
